[package]
name = "ornisculpt"
version = "0.1.0"
edition = "2024"

[features]
# Motion holds every joint a body declares limits for (`Anatomy::joint_limits`) within them, as
# the last pose stage: no knee bends like an elbow, whatever the cycles, IK or hands ask for.
joint-limits = []
# Soft tissue (`src/soft.rs`): fat pads and muscle bellies jiggle on damped springs, hang with
# gravity and tense under load. Hero mobs run the springs; crowd tiers play them baked.
soft-tissue = []
# Browser build (wasm32-unknown-unknown; `tools/web.sh`): Bevy's web platform support and the
# WebGPU backend (the crowd skinning compute shader and storage buffers rule out WebGL2), randomness
# from the browser, and the parallel meshing stages on the calling thread (browsers have no threads).
# Creatures as DNA (`anatomy::genome`): body, coat and form in one genome, with the traits a
# design lets vary, through the `genetics` crate.
genetics = ["dep:genetics"]
# The live GPU preview of a body while it's edited (`surface::SdfPreview`): the packed body field,
# ray-marched and baked into distance bricks by shaders that mirror the CPU field. For authoring
# tools (ornisculpter); games leave it off.
preview = []
# Interchange (`interchange`): body plans, authored parts and garments to and from glTF, so artists
# can author in their own tools (`docs/design/interchange.md`).
interchange = ["dep:serde_json", "dep:base64"]
web = ["bevy/web", "bevy/webgpu", "dep:getrandom02", "dep:getrandom04"]

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["3d", "serialize", "png"] }
bytemuck = { version = "1", features = ["derive"] }
fast-surface-nets = "0.2"
fastnoise-lite = "1.1"
# The `traits` branch, until it lands on master.
genetics = { git = "https://github.com/ChousX/genetics", branch = "traits", optional = true }
mesh_to_sdf = "0.4"
meshopt = "0.6"
rand = "0.10"
serde_json = { version = "1", optional = true }
base64 = { version = "0.23", optional = true }
rand_pcg = "0.10"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
smallvec = { version = "1", features = ["serde", "union", "const_generics"] }
thiserror = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# Browser randomness for `rand` 0.10 and for `mesh_to_sdf`'s `bvh` (rand 0.8): `web` only.
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"], optional = true }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"], optional = true }

# Tests read the glTF part meshes the sample plans reference (`anatomy::build_src`).
[dev-dependencies]
base64 = "0.23"
# Interchange tests check exported files with the glTF reader Bevy already builds.
gltf = { version = "1.4", default-features = false, features = ["extras", "names", "utils"] }
serde_json = "1"

# For the examples: hot reload (not in the browser, where Bevy rejects `file_watcher`) and the
# UI cameras the headless screenshots retarget (`examples/common`).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
bevy = { version = "0.20", default-features = false, features = ["file_watcher", "bevy_ui_render", "default_font"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
bevy = { version = "0.20", default-features = false, features = ["bevy_ui_render", "default_font"] }

# Bevy is slow in debug; optimize dependencies but keep our crate fast to rebuild.
[profile.dev.package."*"]
opt-level = 3

# Browser builds (`tools/web.sh`): release, minus the symbol names that double the .wasm.
[profile.web]
inherits = "release"
strip = true


[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Bevy system params (Res, Query, Extract, On, ...) must be taken by value.
needless_pass_by_value = "allow"
# DENY PANICS:
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
