<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Ornisculpt</title>
	<style>
		html, body { margin: 0; min-height: 100%; background: #111; color: #ccc; font: 14px system-ui, sans-serif; }
		body { display: flex; align-items: center; justify-content: center; }
		canvas { outline: none; }
		#status { position: absolute; top: 1rem; left: 1rem; margin: 0; }
	</style>
</head>
<body>
	<p id="status">Loading…</p>
	<script type="module">
		// Built by tools/web-run.sh: app.js and app_bg.wasm come from wasm-bindgen.
		import init from './app.js';
		const status = document.getElementById('status');
		if (!navigator.gpu) {
			status.textContent = 'This build needs WebGPU: use a current Chrome or Edge, or Firefox 141 or later.';
		} else {
			init()
				.then(() => status.remove())
				.catch((e) => {
					// winit leaves the event loop running by throwing; that is not a failure.
					if (String(e).includes('control flow')) { status.remove(); return; }
					status.textContent = `Failed to start: ${e}`;
				});
		}
	</script>
</body>
</html>
